<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Proyecto Cardona · Lakeland</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0e1a24; font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; }
  #scene { position:fixed; inset:0; display:block; touch-action:none; }
  .overlay { position:fixed; z-index:10; color:#fff; pointer-events:none; }
  #title { top:14px; left:16px; text-shadow:0 1px 6px rgba(0,0,0,.55); }
  #title h1 { font-size:22px; font-weight:700; letter-spacing:.3px; }
  #title p { font-size:13.5px; opacity:.92; margin-top:2px; }
  #title .brand { font-size:11px; font-weight:700; letter-spacing:2.2px; text-transform:uppercase; color:#9fd0ff; margin-bottom:3px; }
  #concept { right:14px; bottom:12px; font-size:11px; opacity:.75; text-shadow:0 1px 4px rgba(0,0,0,.6); }
  #hint { left:50%; transform:translateX(-50%); bottom:14px; font-size:12.5px; background:rgba(10,22,33,.55); padding:6px 14px; border-radius:20px; backdrop-filter:blur(4px); white-space:nowrap; }
  .btns { position:fixed; z-index:11; top:14px; right:14px; display:flex; gap:8px; }
  .btn { pointer-events:auto; cursor:pointer; border:1px solid rgba(255,255,255,.35); background:rgba(13,30,44,.72); color:#fff; font-size:13px; font-weight:600; padding:9px 15px; border-radius:22px; backdrop-filter:blur(4px); transition:background .15s, border-color .15s; }
  .btn:hover { background:rgba(31,63,90,.85); }
  .btn.active { background:#2e7cc4; border-color:#2e7cc4; }
  #panel { position:fixed; z-index:12; left:16px; bottom:16px; width:262px; max-width:calc(100vw - 32px); background:rgba(11,25,38,.88); border:1px solid rgba(255,255,255,.16); border-radius:14px; padding:16px 16px 14px; color:#fff; backdrop-filter:blur(6px); transform:translateY(16px); opacity:0; pointer-events:none; transition:all .25s ease; }
  #panel.show { transform:translateY(0); opacity:1; pointer-events:auto; }
  #panel h2 { font-size:19px; margin-bottom:3px; }
  #panel p { font-size:13px; opacity:.85; margin-bottom:12px; line-height:1.45; }
  #panel .tour { display:block; width:100%; border:none; cursor:pointer; font-family:inherit; text-align:center; background:#2e7cc4; color:#fff; font-weight:700; font-size:14px; padding:11px 10px; border-radius:9px; }
  #panel .tour:hover { background:#3a8ad4; }
  #tourOverlay { position:fixed; inset:0; z-index:30; background:#0e1a24; display:none; flex-direction:column; }
  #tourOverlay.show { display:flex; }
  #tourBar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; background:rgba(11,25,38,.95); color:#fff; }
  #tourBar span { font-size:14.5px; font-weight:700; }
  #tourClose { pointer-events:auto; cursor:pointer; border:1px solid rgba(255,255,255,.35); background:rgba(31,63,90,.85); color:#fff; font-size:13px; font-weight:600; padding:8px 14px; border-radius:20px; font-family:inherit; }
  #tourClose:hover { background:rgba(46,124,196,.9); }
  #tourFrame { flex:1; width:100%; border:0; background:#0e1a24; }
  #panel .close { position:absolute; top:8px; right:12px; background:none; border:none; color:#fff; font-size:19px; cursor:pointer; opacity:.75; line-height:1; }
  #loading { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; color:#cfe6ff; font-size:15px; background:#0e1a24; transition:opacity .4s; }
  @media (max-width:560px){ #title h1{font-size:18px;} #hint{display:none;} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>

<div id="loading">Cargando visualización…</div>

<div class="overlay" id="title">
  <div class="brand">Mega Steel Pro</div>
  <h1>Proyecto Cardona · Lakeland</h1>
  <p>11 casas · Modelo Casco · 5245 US Highway 98 N</p>
</div>

<div class="btns">
  <button class="btn" id="btnHome">Vista general</button>
  <button class="btn" id="btnOrbit">Orbitar</button>
</div>

<div class="overlay" id="hint">Tocá una casa para verla de cerca</div>
<div class="overlay" id="concept">Visualización conceptual</div>

<div id="panel">
  <button class="close" id="panelClose" aria-label="Cerrar">×</button>
  <h2 id="panelTitle">Casa 1</h2>
  <p>Modelo Casco · 1 planta · Steel framing<br>3 dormitorios · 2 baños</p>
  <button class="tour" id="btnTour">Entrar a la casa</button>
</div>

<div id="tourOverlay">
  <div id="tourBar"><span id="tourTitle">Casa 1 · Recorrido interior</span><button id="tourClose">✕ Volver al proyecto</button></div>
  <iframe id="tourFrame" title="Recorrido interior" allow="fullscreen"></iframe>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const TOUR_URL = 'https://lombema14-code.github.io/recorrido-1820-casco/';
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
// cielo con degradé de tarde: azul arriba, horizonte cálido
(function(){
  const c = document.createElement('canvas'); c.width = 4; c.height = 512;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#5f9fd6'); gr.addColorStop(0.45, '#9cc3e4');
  gr.addColorStop(0.75, '#d9e6ee'); gr.addColorStop(1, '#f4dcae');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
})();
scene.fog = new THREE.Fog(0xdfe7ec, 1500, 3800);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.5, 5000);
const HOME_POS = new THREE.Vector3(500, 620, 740);
const HOME_TGT = new THREE.Vector3(-20, 0, 0);
camera.position.copy(HOME_POS);

const controls = new OrbitControls(camera, canvas);
controls.target.copy(HOME_TGT);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 25;
controls.maxDistance = 2400;
controls.autoRotateSpeed = 0.7;

// sol cálido de tarde, desde el oeste, sombras suaves
const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x4a6b3a, 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffdfae, 2.1);
sun.position.set(-650, 430, 330);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -950; sun.shadow.camera.right = 950;
sun.shadow.camera.top = 650; sun.shadow.camera.bottom = -650;
sun.shadow.camera.far = 2800;
sun.shadow.bias = -0.0006;
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.12));

// ---------- materiales compartidos del sitio ----------
const M = {
  grassLot:  new THREE.MeshStandardMaterial({ color:0x69a24e, roughness:1 }),
  grassDry:  new THREE.MeshStandardMaterial({ color:0x7da457, roughness:1 }),
  grassOut:  new THREE.MeshStandardMaterial({ color:0x59863f, roughness:1 }),
  brush:     new THREE.MeshStandardMaterial({ color:0x5d7a3c, roughness:1 }),
  brushDry:  new THREE.MeshStandardMaterial({ color:0x7d7a45, roughness:1 }),
  asphalt:   new THREE.MeshStandardMaterial({ color:0x3c4147, roughness:.95 }),
  street:    new THREE.MeshStandardMaterial({ color:0x494f57, roughness:.95 }),
  concrete:  new THREE.MeshStandardMaterial({ color:0xb9bcbe, roughness:.9 }),
  sidewalk:  new THREE.MeshStandardMaterial({ color:0xc9ccce, roughness:.9 }),
  slab:      new THREE.MeshStandardMaterial({ color:0xa8abad, roughness:.9 }),
  roof:      new THREE.MeshStandardMaterial({ color:0x4a4443, roughness:.85, flatShading:true }),
  roofAlt:   new THREE.MeshStandardMaterial({ color:0x5d5350, roughness:.85, flatShading:true }),
  brick:     new THREE.MeshStandardMaterial({ color:0x95584a, roughness:.95 }),
  roofBrown: new THREE.MeshStandardMaterial({ color:0x7d4a38, roughness:.9, flatShading:true, side:THREE.DoubleSide }),
  metalRoof: new THREE.MeshStandardMaterial({ color:0xb4b8bc, roughness:.45, metalness:.35 }),
  glass:     new THREE.MeshStandardMaterial({ color:0x22384a, roughness:.25, metalness:.35 }),
  glassDark: new THREE.MeshStandardMaterial({ color:0x2a3d4d, roughness:.25, metalness:.3 }),
  door:      new THREE.MeshStandardMaterial({ color:0x24507e, roughness:.6 }),
  white:     new THREE.MeshStandardMaterial({ color:0xf2efe9, roughness:.8 }),
  trunk:     new THREE.MeshStandardMaterial({ color:0x6b4a2f, roughness:1 }),
  leaf1:     new THREE.MeshStandardMaterial({ color:0x3e7d32, roughness:1, flatShading:true }),
  leaf2:     new THREE.MeshStandardMaterial({ color:0x4c8f3c, roughness:1, flatShading:true }),
  lineWhite: new THREE.MeshBasicMaterial({ color:0xe8e8e2 }),
  lineYellow:new THREE.MeshBasicMaterial({ color:0xf2c230 }),
};

// ---------- geometrías compartidas ----------
const G = {
  box: new THREE.BoxGeometry(1,1,1),
  trunk: new THREE.CylinderGeometry(0.55, 0.8, 6, 6),
  crown1: new THREE.IcosahedronGeometry(5.2, 0),
  crown2: new THREE.IcosahedronGeometry(3.8, 0),
};
function box(mat, w, h, d, x, y, z, parent, shadow=true){
  const m = new THREE.Mesh(G.box, mat);
  m.scale.set(w, h, d); m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  (parent || scene).add(m); return m;
}
function flat(mat, w, d, x, z, y=0.06, parent){
  const m = box(mat, w, 0.12, d, x, y, z, parent, false);
  m.castShadow = false; return m;
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- terreno y lote ----------
// Coordenadas: x = este, z = sur. Norte = z negativo. La ruta 98 corre al OESTE (x negativo).
const LOT_W = 1200, LOT_D = 320; // pies: franja larga este-oeste
const LOT_X0 = -LOT_W/2, LOT_X1 = LOT_W/2; // -600 .. 600
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3600, 3600), M.grassOut);
ground.rotation.x = -Math.PI/2; ground.position.y = -0.08; ground.receiveShadow = true; scene.add(ground);
// mitad oeste más verde, mitad este más seca (como se ve en el satélite)
const lotW = new THREE.Mesh(new THREE.PlaneGeometry(500, LOT_D), M.grassLot);
lotW.rotation.x = -Math.PI/2; lotW.position.set(-350, 0, 0); lotW.receiveShadow = true; scene.add(lotW);
const lotE = new THREE.Mesh(new THREE.PlaneGeometry(700, LOT_D), M.grassDry);
lotE.rotation.x = -Math.PI/2; lotE.position.set(250, 0, 0); lotE.receiveShadow = true; scene.add(lotE);
// borde del lote
flat(M.concrete, LOT_W+3, 2, 0, -LOT_D/2, 0.03);
flat(M.concrete, LOT_W+3, 2, 0,  LOT_D/2, 0.03);
// variación de tonos de verde sobre el pasto (manchas grandes y suaves)
(function(){
  const circ = new THREE.CircleGeometry(1, 18);
  const mats = [0x5f9a48, 0x74ab54, 0x86b364, 0x679c4a, 0x7fae5c].map(c => new THREE.MeshStandardMaterial({ color:c, roughness:1 }));
  for (let i = 0; i < 52; i++) {
    const x = -580 + rnd() * 1160, z = -152 + rnd() * 304;
    if (Math.abs(z) < 22 && x > -430) continue;                          // calle interna
    if (Math.abs(Math.abs(z) - 75) < 46 && x > -130 && x < 565) continue; // filas de casas
    if (x > -512 && x < -398 && Math.abs(z) < 108) continue;              // estacionamiento
    if (x > -562 && x < -478 && Math.abs(z) < 98) continue;               // edificio existente
    const m = new THREE.Mesh(circ, mats[i % mats.length]);
    m.rotation.x = -Math.PI/2;
    m.position.set(x, 0.028, z);
    m.scale.set(16 + rnd() * 30, 10 + rnd() * 20, 1);
    m.receiveShadow = true;
    scene.add(m);
  }
})();
// manchas de maleza en el campo abierto
(function(){
  const circ = new THREE.CircleGeometry(1, 14);
  for (let i = 0; i < 30; i++) {
    const x = -420 + rnd() * 980, z = -140 + rnd() * 280;
    if (Math.abs(z) < 34 && x > -430) continue;              // no sobre la calle interna
    if (Math.abs(Math.abs(z) - 75) < 44 && x > -130 && x < 565) continue; // no sobre las casas
    if (x > -510 && x < -400 && Math.abs(z) < 105) continue; // no sobre el estacionamiento
    if (x > -560 && x < -480 && Math.abs(z) < 95) continue;  // no sobre el edificio
    const m = new THREE.Mesh(circ, rnd() > .45 ? M.brush : M.brushDry);
    m.rotation.x = -Math.PI/2;
    m.position.set(x, 0.045, z);
    m.scale.setScalar(7 + rnd() * 13);
    m.receiveShadow = true;
    scene.add(m);
  }
})();

// ---------- US Highway 98 (borde oeste, corre norte-sur) ----------
// Cuatro carriles con cantero central de pasto y banquinas.
const HWY_X = -632;
flat(M.asphalt, 68, 1700, HWY_X, 0, 0.04);
flat(M.grassOut, 12, 1700, HWY_X, 0, 0.055);                       // cantero central
for (const s of [-1, 1]) {
  flat(M.lineYellow, 0.9, 1700, HWY_X + s * 7.2, 0, 0.1);          // líneas amarillas del cantero
  flat(M.lineWhite, 1, 1700, HWY_X + s * 32, 0, 0.1);              // borde de calzada
  for (let z = -830; z <= 830; z += 36) flat(M.lineWhite, 1.1, 16, HWY_X + s * 19.5, z, 0.11); // divisoria de carriles
}
// cartel de la ruta pintado sobre el asfalto, a lo largo de la calzada
(function(){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 96;
  const g = c.getContext('2d');
  g.font = '700 58px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = 'rgba(255,255,255,0.92)';
  g.fillText('U S   H I G H W A Y   9 8', 512, 50);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  const geo = new THREE.PlaneGeometry(200, 19);
  geo.rotateX(-Math.PI/2); geo.rotateY(Math.PI/2); // texto a lo largo de z, se lee de sur a norte
  const p = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map:tex, transparent:true }));
  p.position.set(HWY_X - 16, 0.16, 150); scene.add(p);
})();

// ---------- edificio existente (frente oeste, sobre la ruta) ----------
// Alargado norte-sur, una planta, ladrillo rojizo. NO es una casa, no es clicable.
const BLD = { x:-520, w:55, d:170, h:13 };
(function(){
  const grp = new THREE.Group();
  // platea y paredes de ladrillo
  box(M.concrete, BLD.w + 4, 1, BLD.d + 4, BLD.x, 0.5, 0, grp);
  box(M.brick, BLD.w, BLD.h, BLD.d, BLD.x, BLD.h/2 + 1, 0, grp);
  // techo inclinado marrón rojizo, en secciones, sobre la porción oeste
  function gableGeo(len, wid, h){
    const hw = wid/2, hl = len/2;
    const v = [
      -hw,0,-hl,  -hw,0,hl,  0,h,hl,    -hw,0,-hl,  0,h,hl,  0,h,-hl,   // pendiente oeste
       hw,0,hl,   hw,0,-hl,  0,h,-hl,    hw,0,hl,   0,h,-hl, 0,h,hl,    // pendiente este
      -hw,0,-hl,  0,h,-hl,   hw,0,-hl,                                    // tímpano norte
       hw,0,hl,   0,h,hl,   -hw,0,hl,                                     // tímpano sur
    ];
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
    geo.computeVertexNormals();
    return geo;
  }
  const gx = BLD.x - BLD.w/2 + 17; // centro de la porción oeste techada
  for (const zc of [-56, 0, 56]) {
    const r = new THREE.Mesh(gableGeo(50, 34, 5.5), M.roofBrown);
    r.position.set(gx, BLD.h + 1, zc); r.castShadow = true; r.receiveShadow = true; grp.add(r);
  }
  // franja de techo plano metálico gris claro sobre el lado este
  box(M.metalRoof, 23, 0.5, BLD.d, BLD.x + BLD.w/2 - 11.5, BLD.h + 1.2, 0, grp);
  for (const zc of [-50, 0, 50]) box(M.metalRoof, 8, 3, 6, BLD.x + BLD.w/2 - 11.5, BLD.h + 2.9, zc, grp);
  // vidriera hacia el estacionamiento (este) y puerta
  box(M.glass, 0.35, 6.5, 118, BLD.x + BLD.w/2 + 0.1, 4.4, 0, grp, false);
  box(M.door, 0.4, 8, 5, BLD.x + BLD.w/2 + 0.1, 5, 0, grp, false);
  scene.add(grp);
})();
// etiqueta del edificio
(function(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 96;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(11,25,38,0.85)';
  g.beginPath(); g.roundRect(6, 10, 500, 76, 38); g.fill();
  g.font = '700 42px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#ffffff';
  g.fillText('Edificio existente', 256, 50);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true }));
  sp.scale.set(86, 16, 1);
  sp.position.set(BLD.x, 33, 0);
  scene.add(sp);
})();

// ---------- estacionamiento al ESTE del edificio ----------
const PARK = { x0:-492, x1:-412, z0:-95, z1:95 };
flat(M.asphalt, PARK.x1 - PARK.x0, PARK.z1 - PARK.z0, (PARK.x0 + PARK.x1)/2, 0, 0.055);
for (let z = PARK.z0 + 4; z <= PARK.z1 - 4; z += 11) {
  flat(M.lineWhite, 16, 0.55, PARK.x0 + 9, z, 0.13);  // filas contra el edificio
  flat(M.lineWhite, 16, 0.55, PARK.x1 - 9, z, 0.13);  // filas del lado este
}
// ---------- entrada: desde la 98 rodea el edificio y llega al estacionamiento ----------
flat(M.asphalt, 48, 22, -601, -112, 0.05);            // empalme con la ruta, al norte del edificio
flat(M.asphalt, 20, 244, -568, 0, 0.05);              // pasada por el lado oeste del edificio
flat(M.asphalt, 118, 20, -508, -112, 0.05);           // rodea el extremo norte
flat(M.asphalt, 118, 20, -508, 112, 0.05);            // rodea el extremo sur

// ---------- calle interna: del estacionamiento hacia el este ----------
const STREET_Y = 0;
flat(M.street, 992, 24, 84, STREET_Y, 0.07);
for (let x = -400; x <= 565; x += 30) flat(M.lineWhite, 14, 0.9, x, STREET_Y, 0.15);
flat(M.sidewalk, 992, 4, 84, STREET_Y - 14, 0.08);
flat(M.sidewalk, 992, 4, 84, STREET_Y + 14, 0.08);

// ---------- techo a cuatro aguas genérico (vecinos) ----------
function hipRoofGeo(w, d, h, ridge){
  const hw = w/2, hd = d/2, r = ridge/2;
  const v = [
    -hw,0,hd,  hw,0,hd,  r,h,0,   -hw,0,hd,  r,h,0,  -r,h,0,
    hw,0,-hd,  -hw,0,-hd,  -r,h,0,   hw,0,-hd,  -r,h,0,  r,h,0,
    -hw,0,-hd,  -hw,0,hd,  -r,h,0,
    hw,0,hd,  hw,0,-hd,  r,h,0,
  ];
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  geo.computeVertexNormals();
  return geo;
}

// =====================================================================
// CASA CASCO REAL (exterior)
// Geometría y materiales tomados del modelo Casco del recorrido interior:
// mismas medidas (huella aprox. 67 x 37 pies, frente/porch al este),
// mismas paredes con sus ventanas y puertas reales, techos a cuatro aguas,
// porch propio y patio trasero. El interior no se modela (vidrios tonalizados);
// se incluye piso y cielorraso para que no se vea hueca.
// Se construye UNA vez y su geometría se fusiona por material, así las 11
// copias comparten geometría y la página queda liviana.
// =====================================================================
const CM = {
  stucco:  new THREE.MeshStandardMaterial({ color:0xf6e9d2, roughness:.93 }),
  wallInt: new THREE.MeshStandardMaterial({ color:0xf1efe9, roughness:.9 }),
  ceiling: new THREE.MeshStandardMaterial({ color:0xf7f6f2, roughness:.95 }),
  roof:    new THREE.MeshStandardMaterial({ color:0x7e7a74, roughness:.88, side:THREE.DoubleSide }),
  fascia:  new THREE.MeshStandardMaterial({ color:0xeeebe4, roughness:.6, side:THREE.DoubleSide }),
  trim:    new THREE.MeshStandardMaterial({ color:0xf4f3ef, roughness:.45 }),
  glass:   new THREE.MeshStandardMaterial({ color:0x9db8c8, roughness:.08, metalness:.25, transparent:true, opacity:.38, side:THREE.DoubleSide, depthWrite:false }),
  concrete:new THREE.MeshStandardMaterial({ color:0xb8b4ac, roughness:.9 }),
  found:   new THREE.MeshStandardMaterial({ color:0xb9b3a8, roughness:1 }),
  floor:   new THREE.MeshStandardMaterial({ color:0x9c7c55, roughness:.6 }),
  door:    new THREE.MeshStandardMaterial({ color:0xf6f5f1, roughness:.45 }),
  extDoor: new THREE.MeshStandardMaterial({ color:0x435263, roughness:.4 }),
  metal:   new THREE.MeshStandardMaterial({ color:0x8a8d90, roughness:.35, metalness:.6 }),
  steel:   new THREE.MeshStandardMaterial({ color:0xd2d5d8, roughness:.3, metalness:.85 }),
  ac:      new THREE.MeshStandardMaterial({ color:0x9fa4a8, roughness:.6, metalness:.3 }),
  dark:    new THREE.MeshStandardMaterial({ color:0x26282b, roughness:.45 }),
  wood:    new THREE.MeshStandardMaterial({ color:0x8a6f52, roughness:.8 }),
};

// ---------- fusión de geometrías por material ----------
function mergeGeos(geos){
  let total = 0;
  for (const g of geos) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), uv = new Float32Array(total * 2);
  let o3 = 0, o2 = 0;
  for (const g of geos) {
    pos.set(g.attributes.position.array, o3);
    nor.set(g.attributes.normal.array, o3);
    uv.set(g.attributes.uv.array, o2);
    o3 += g.attributes.position.count * 3;
    o2 += g.attributes.position.count * 2;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return out;
}
function buildCascoMerged(){
  const tpl = buildCascoTemplate();
  tpl.updateMatrixWorld(true);
  const buckets = new Map();
  tpl.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry;
    g.applyMatrix4(o.matrixWorld);
    if (!buckets.has(o.material)) buckets.set(o.material, []);
    buckets.get(o.material).push(g);
  });

  let meshCount = 0;
  for (const [mat, geos] of buckets) {

    m.castShadow = mat !== CM.glass;
    m.receiveShadow = true;
    if (mat === CM.stucco) m.userData.isStucco = true;
    merged.add(m); meshCount++;
  }

}

  inner.traverse(o => { if (o.userData.isStucco) { o.material = CM.stucco.clone(); outer.userData.wallMat = o.material; } });
  outer.add(inner);
  // vereda desde la calle al escalón del porch y entrada de autos lateral
  flat(M.concrete, 22, 3, 48, -10.5, 0.07, outer);
  flat(M.concrete, 22, 14, 48, 8.5, 0.06, outer);
  outer.position.set(p.x, 0, p.z);
  outer.rotation.y = p.rot;
  outer.userData.index = i;
  outer.traverse(o => { o.userData.houseIndex = i; });
  scene.add(outer); houses.push(outer);
});

// =====================================================================
// ENTORNO / VECINDARIO (contexto, más simple que las casas protagonistas)
// =====================================================================
// ---------- norte: local de comidas rápidas junto a la ruta ----------
// La entrada del lote pasa justo al sur de este local.

// ---------- norte, tras la arboleda: casas de Swann Dr ----------
flat(M.asphalt, 1150, 18, 30, -172, 0.04);                         // calle Swann Dr
(function(){

// ---------- sur: plaza comercial ----------
// Locales bajos de techo plano con estacionamiento al frente (lado norte).
(function(){

  const defs = [

// ---------- sudeste: complejo de departamentos (3 plantas) ----------
(function(){
  flat(M.asphalt, 215, 135, 460, 250, 0.04);

// ---------- árboles ----------
function tree(x, z, s=1){
  const g = new THREE.Group();
  const t = new THREE.Mesh(G.trunk, M.trunk); t.position.y = 3; t.castShadow = true; g.add(t);
  const c1 = new THREE.Mesh(G.crown1, Math.random() > .5 ? M.leaf1 : M.leaf2);
  c1.position.y = 9.5; c1.castShadow = true; g.add(c1);
  const c2 = new THREE.Mesh(G.crown2, M.leaf2);
  c2.position.set(2.6, 12.4, 1.4); c2.castShadow = true; g.add(c2);
  g.position.set(x, 0, z); g.scale.setScalar(s * (0.85 + Math.random() * 0.5));
  g.rotation.y = Math.random() * Math.PI * 2;
  scene.add(g);
}
// franja de pasto entre la ruta y el edificio: algunos árboles
for (const z of [-64, -24, 26, 76]) tree(-592 + rnd() * 6, z);
// líneas densas de árboles en los bordes norte y sur (al norte, hueco en el local de comidas)
for (let x = -585; x <= 585; x += 26 + rnd() * 10) {
  if (!(x > -625 && x < -518)) { tree(x, -150 + rnd() * 8); if (rnd() > .4) tree(x + 12, -141 + rnd() * 6); }
}
for (let x = -585; x <= 585; x += 26 + rnd() * 10) { tree(x, 150 - rnd() * 8); if (rnd() > .4) tree(x + 12, 141 - rnd() * 6); }
// bosque denso cerrando el extremo este
for (let i = 0; i < 34; i++) tree(548 + rnd() * 48, -148 + rnd() * 296, 1.15);
// árboles sueltos en el campo abierto del oeste
for (let i = 0; i < 16; i++) {
  const x = -400 + rnd() * 300, z = (rnd() > .5 ? 1 : -1) * (60 + rnd() * 70);
  tree(x, z);
}
// árboles en los huecos entre casas, detrás de cada fila
for (const gx of [-5, 105, 215, 325, 435]) { tree(gx, -118); tree(gx + 6, 118); }

// ---------- autos (geometrías y materiales compartidos) ----------
const carGeos = {
  body: new THREE.BoxGeometry(12.5, 2.7, 5.4),
  cab: new THREE.BoxGeometry(6.6, 2.3, 4.9),
  wheel: new THREE.CylinderGeometry(1.05, 1.05, 0.8, 10),
};
const tireMat = new THREE.MeshStandardMaterial({ color:0x1c1c1e, roughness:.95 });
const carCols = [0xc0c4c8, 0x7a8894, 0xa33327, 0x2e4a6b, 0xe3e0d8, 0x3a3f44];
let carIdx = 0;
function car(x, z, rot){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: carCols[carIdx++ % carCols.length], roughness:.35, metalness:.5 });
  const b = new THREE.Mesh(carGeos.body, mat); b.position.y = 2.0; b.castShadow = true; g.add(b);
  const c = new THREE.Mesh(carGeos.cab, M.glassDark); c.position.set(-0.4, 4.2, 0); c.castShadow = true; g.add(c);
  for (const [wx, wz] of [[-4.2, 2.5], [4.2, 2.5], [-4.2, -2.5], [4.2, -2.5]]) {
    const w = new THREE.Mesh(carGeos.wheel, tireMat);
    w.rotation.x = Math.PI / 2; w.position.set(wx, 1.05, wz); g.add(w);
  }
  g.position.set(x, 0, z); g.rotation.y = rot;
  scene.add(g);
}
car(-472, -42, 0.03); car(-428, 48, -0.03);        // estacionamiento del edificio existente
car(-592, -132, 0.06); car(-550, -132.5, -0.05);   // local de comidas
car(-262, 166, 0.04); car(-58, 167, -0.03); car(150, 166, 0.02); // plaza comercial
car(452, 244, 0.5); car(470, 240, -0.3);           // departamentos
car(41.5, -27, -Math.PI/2);                        // entrada de la Casa 2
car(371.5, -27, -Math.PI/2);                       // entrada de la Casa 5
car(3.5, 27, Math.PI/2);                           // entrada de la Casa 7

// ---------- interacción ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let selected = -1;
let camAnim = null;
function flyTo(pos, tgt, dur=1400){
  camAnim = { p0:camera.position.clone(), p1:pos.clone(), t0:controls.target.clone(), t1:tgt.clone(), start:performance.now(), dur };
}
function highlight(i){
  houses.forEach((h, j) => {
    const m = h.userData.wallMat;
    if (!m) return;
    if (j === i) { m.emissive = new THREE.Color(0xcf8a2d); m.emissiveIntensity = 0.38; }
    else { m.emissive = new THREE.Color(0x000000); m.emissiveIntensity = 0; }
  });
}
const panel = document.getElementById('panel');
const panelTitle = document.getElementById('panelTitle');
function selectHouse(i){
  selected = i;
  highlight(i);
  const h = houses[i];
  const front = new THREE.Vector3(1, 0, 0).applyEuler(h.rotation); // frente Casco: +x local (porch)
  const side = new THREE.Vector3(front.z, 0, -front.x);
  const camPos = h.position.clone().add(front.clone().multiplyScalar(80)).add(side.multiplyScalar(46)).add(new THREE.Vector3(0, 36, 0));
  flyTo(camPos, h.position.clone().add(new THREE.Vector3(0, 6, 0)));
  panelTitle.textContent = 'Casa ' + (i + 1);
  panel.classList.add('show');
  document.getElementById('hint').style.display = 'none';
}
function overview(){
  selected = -1; highlight(-1);
  panel.classList.remove('show');
  flyTo(HOME_POS, HOME_TGT);
}
window.__cardona = {
  selectHouse, overview, houses: houses.length,
  houseMeshes: cascoTpl.userData.meshCount,
  camTo(px, py, pz, tx, ty, tz){ camera.position.set(px, py, pz); controls.target.set(tx, ty, tz); },
  stats(){ let meshes = 0; scene.traverse(o => { if (o.isMesh) meshes++; }); return { meshes, calls: renderer.info.render.calls, triangles: renderer.info.render.triangles }; }
};

let downX = 0, downY = 0;
canvas.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; });
canvas.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(houses, true);
  if (hits.length) selectHouse(hits[0].object.userData.houseIndex);
});
const tourOverlay = document.getElementById('tourOverlay');
const tourFrame = document.getElementById('tourFrame');
const tourTitle = document.getElementById('tourTitle');
document.getElementById('btnTour').addEventListener('click', () => {
  tourTitle.textContent = 'Casa ' + (selected + 1) + ' · Recorrido interior';
  if (!tourFrame.src) tourFrame.src = TOUR_URL;
  tourOverlay.classList.add('show');
});
document.getElementById('tourClose').addEventListener('click', () => tourOverlay.classList.remove('show'));
document.getElementById('btnHome').addEventListener('click', overview);
document.getElementById('panelClose').addEventListener('click', overview);
const btnOrbit = document.getElementById('btnOrbit');
btnOrbit.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnOrbit.classList.toggle('active', controls.autoRotate);
});

// ---------- loop ----------
function animate(){
  requestAnimationFrame(animate);
  if (camAnim) {
    const t = Math.min(1, (performance.now() - camAnim.start) / camAnim.dur);
    const e = t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e);
    controls.target.lerpVectors(camAnim.t0, camAnim.t1, e);
    if (t >= 1) camAnim = null;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// primera pintura lista
requestAnimationFrame(() => requestAnimationFrame(() => {
  window.__ready = true;
  const l = document.getElementById('loading');
  if (l) { l.style.opacity = '0'; setTimeout(() => l.remove(), 450); }
}));
</script>
